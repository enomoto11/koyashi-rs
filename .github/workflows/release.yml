name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-analyzer

      - uses: Swatinem/rust-cache@v2

      # Fail early if the tag does not match the version declared in
      # Cargo.toml so a stray tag cannot publish a mismatched version.
      - name: verify tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "koyashi-rs") | .version')
          if [ "$tag" != "$manifest" ]; then
            echo "tag v$tag does not match Cargo.toml version $manifest" >&2
            exit 1
          fi

      - name: rust-analyzer version
        run: rust-analyzer --version

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked --verbose

      - name: publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
