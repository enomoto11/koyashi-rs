[package]
name = "koyashi-rs"
version = "0.1.0"
edition = "2024"
description = "Detect freeloader (koyashi) struct fields in Rust workspaces without cargo build"
license = "MIT"
repository = "https://github.com/enomoto11/koyashi-rs"
readme = "README.md"
keywords = ["cli", "static-analysis", "dead-code", "linter", "rust-analyzer"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/tests/fixtures"]

[[bin]]
name = "koyashi"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
cargo_metadata = "0.23.1"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
syn = { version = "2.0.117", features = ["full", "visit"] }
toml = "1.1.2"
